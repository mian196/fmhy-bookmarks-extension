name: Package & Release Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Extract Tag Version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build Extension Packages for Chromium and Firefox
        run: python tools/build.py "${{ env.VERSION }}"

      - name: Generate Gemini AI Release Notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/gemini_release_notes.py

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ hashFiles('gemini_release_notes.md') != '' && 'gemini_release_notes.md' || '' }}
          generate_release_notes: ${{ hashFiles('gemini_release_notes.md') == '' }}
          files: |
            dist/fmhy-bookmarks-extension-${{ env.VERSION }}.chromium.zip
            dist/fmhy-bookmarks-extension-${{ env.VERSION }}.firefox.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Release Notes for AMO
        id: amo_notes
        run: |
          if [ -f "gemini_release_notes.md" ]; then
            notes=$(cat gemini_release_notes.md)
          else
            notes="Release ${{ env.VERSION }} of FMHY Bookmarks Auto-Sync extension."
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$notes" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publish to Firefox Add-ons (AMO)
        if: ${{ env.AMO_API_KEY != '' && env.AMO_API_SECRET != '' }}
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        uses: browser-actions/release-firefox-addon@latest
        with:
          addon-id: 'fmhy-bookmarks-sync@mian196'
          addon-path: dist/fmhy-bookmarks-extension-${{ env.VERSION }}.firefox.zip
          auth-api-issuer: ${{ secrets.AMO_API_KEY }}
          auth-api-secret: ${{ secrets.AMO_API_SECRET }}
          release-note: ${{ steps.amo_notes.outputs.notes }}


